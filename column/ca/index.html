<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA画面｜ONDO Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* CA画面：今日連絡すべき人の一覧 ＋ 1人の詳細（PCは左右2列、スマホは一覧→詳細） */
:root{
  --ink:#14302A; --text:#2A3330; --muted:#6B7A75; --line:#E1E8E4; --soft:#F3F6F4; --bg:#F7F9F8; --card:#FFFFFF;
  --green:#0F7B5F; --green-soft:#E3F1EC; --warm:#E06A2E; --warm-soft:#FCEDE4;
  --hot:#D9443A; --hot-soft:#FBE7E5; --warm2:#E8862E; --warm2-soft:#FDEFE0; --mild:#C9A227; --mild-soft:#FAF3DA; --cool:#4E86C4; --cool-soft:#E6EFF9;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
.bar b{font-size:15px;letter-spacing:.04em}
.bar .mode{font-size:11px;background:#F3B44B;color:var(--ink);font-weight:700;border-radius:999px;padding:2px 10px}
.bar .sp{flex:1}
.bar .upd{font-size:11px;color:#9DB2AA}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.intro{background:var(--card);border:1px solid var(--line);border-left:4px solid #F3B44B;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px}
.intro b{color:var(--ink)}
/* 集計 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi b small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi.hot b{color:var(--hot)}
.funnel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.funnel h2{font-size:13px;margin:0 0 8px;color:var(--ink)}
.fsteps{display:flex;gap:4px;align-items:stretch;overflow-x:auto}
.fs{flex:1 0 110px;background:var(--green-soft);border-radius:8px;padding:8px 10px;position:relative}
.fs span{display:block;font-size:11.5px;color:var(--green);font-weight:700;white-space:nowrap}
.fs b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.fs i{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
.fs.next{background:repeating-linear-gradient(-45deg,#F4F6F5 0 6px,#ECEFED 6px 12px)}
.fs.next span{color:var(--muted)}
.fs.next b{font-size:12px;color:var(--muted);font-weight:500}
/* 一覧と詳細 */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.row[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.row.self{border-left:4px solid #F3B44B}
.temp{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.temp b{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.temp span{font-size:10px;font-weight:700;white-space:nowrap}
.t-hot{background:var(--hot-soft);color:var(--hot)}.t-warm{background:var(--warm2-soft);color:var(--warm2)}.t-mild{background:var(--mild-soft);color:#9A7A0C}.t-cool{background:var(--cool-soft);color:var(--cool)}
.rh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rh b{font-size:15px;color:var(--ink)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap}
.p-stage{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.p-self{background:#FFF1D2;color:#8A5A00}
.p-up{color:var(--hot);font-size:11px;font-weight:700}
.p-bell{background:var(--hot);color:#fff}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:4px;padding:0 6px}
.talk{font-size:12.5px;color:var(--text);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
/* 詳細 */
.detail{position:sticky;top:60px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-height:calc(100vh - 76px);overflow:auto}
.dh{display:flex;align-items:center;gap:14px}
.dh .temp{width:76px;height:76px}
.dh .temp b{font-size:30px}
.dh h2{margin:0;font-size:19px;color:var(--ink)}
.sec{margin-top:16px}
.sec h3{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.axes{display:grid;grid-template-columns:3em 1fr 2.5em;gap:6px 8px;align-items:center;font-size:12.5px}
.axes .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.axes .tr i{display:block;height:100%;background:var(--green);border-radius:4px}
.axes .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tk{background:var(--warm-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.tk+.tk{margin-top:6px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink)}
.bk{border:1.5px solid var(--green);background:var(--green-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.tl{list-style:none;margin:0;padding:0 0 0 4px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 8px 18px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl li.strong::before{border-color:var(--hot);background:var(--hot)}
.tl li.strong{color:var(--ink);font-weight:700}
.tl time{display:block;font-size:11px;color:var(--muted);font-weight:400}
.empty{color:var(--muted);text-align:center;padding:30px}
.tl li.ca::before{border-color:#2F6DB5;background:#2F6DB5}
.tl li.ca{color:#1F4F87}
.p-due{background:#E6EFF9;color:#1F4F87}
.acts{display:flex;gap:8px;margin-top:14px}
.abtn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer;color:var(--ink)}
.abtn.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.abtn.line{background:#06C755;border-color:#06C755;color:#fff}
.abtn.line.on{background:#05A847;border-color:#05A847;color:#fff}
.form{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--soft)}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.form textarea,.form input[type=date]{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text)}
.form textarea{min-height:110px;resize:vertical;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.fnote{font-size:11.5px;color:var(--muted);margin-top:6px}
.frow{display:flex;gap:8px;margin-top:10px;align-items:center}
.go{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer}
.go.line{background:#06C755}
.go:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:13px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.login{max-width:380px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h1{font-size:17px;margin:0 0 6px;color:var(--ink)}
.login input{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.views{position:sticky;top:44px;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:8px 18px 0;overflow-x:auto}
.views button{border:0;background:none;padding:8px 14px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.views button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--green)}
.bcgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:15px;margin:0 0 4px;color:var(--ink)}
.panel .sub{font-size:12px;color:var(--muted);margin:0 0 6px}
.grp{margin-top:12px}
.grp>b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.panel input[type=text],.panel input[type=datetime-local],.panel input[type=number],.panel select,.panel textarea,.scform input[type=text],.scform input[type=number],.scform select,.scform textarea{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text)}
.panel textarea,.scform textarea{min-height:120px;resize:vertical;line-height:1.7}
.scform .grp>b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.scform .grp{margin-top:12px}
.scform summary{font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer;margin-top:12px}
.panel details{margin-top:12px}
.panel summary{font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer}
.count{display:flex;align-items:baseline;gap:8px;background:var(--green-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.count b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.count span{font-size:12.5px;color:var(--text)}
.names{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.names span{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.timing label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;font-size:13.5px;background:#fff}
.timing label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.timing small{display:block;color:var(--muted);font-size:11.5px}
.phone{background:#8CABD9;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;white-space:pre-wrap;max-width:88%}
.bub.att{border:1.5px dashed #C7D3E6;color:var(--muted);font-size:12px}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.hi .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hi .t b{font-size:14px;color:var(--ink)}
.st{font-size:11px;border-radius:999px;padding:0 8px;font-weight:700}
.st-done{background:var(--green-soft);color:var(--green)}.st-wait{background:#FFF1D2;color:#8A5A00}.st-cancel{background:var(--soft);color:var(--muted)}
.hi .n{color:var(--muted);margin-top:4px}
.hi .rr{font-weight:700;color:var(--ink)}
.quota{font-size:12px;color:var(--muted);margin-top:8px}
.quota b{color:var(--ink)}
.scs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sc.on{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.sc .h{display:flex;align-items:center;gap:8px}
.sc .h b{flex:1;font-size:14.5px;color:var(--ink)}
.sc .when{font-size:12.5px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px}
.sc .msg{font-size:12.5px;white-space:pre-wrap;color:var(--text);border-left:3px solid var(--line);padding-left:10px}
.sc .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sw{position:relative;width:44px;height:24px;border-radius:12px;border:0;background:#C9D2CE;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--green)}.sw[aria-checked="true"]::after{left:23px}
.sw:disabled{opacity:.5;cursor:default}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
@media (max-width:820px){.bcgrid{grid-template-columns:1fr}.views{top:40px}}
.sc .badge2{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.sc.add{border:2px dashed var(--line);align-items:center;justify-content:center;min-height:180px;cursor:pointer;color:var(--green);font-weight:700;background:transparent}
.sc .tgt{font-size:12px;color:var(--muted)}
.scform{grid-column:1/-1;background:var(--card);border:1.5px solid var(--green);border-radius:14px;padding:16px}
.scform h2{font-size:15px;margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini.danger{color:#B3361F;border-color:#F0C9C2}
/* 分析 */
.period{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.period input[type=date]{font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.skpi{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.skpi .kpi b{font-size:22px}
.skpi .kpi small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin:0}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;margin-bottom:12px;position:relative}
.chartbox h2{font-size:13px;margin:0 0 8px;color:var(--ink)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartscroll{overflow-x:auto}
.chartscroll svg{min-width:560px}
table.st th:first-child,table.st td:first-child{min-width:13em}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:6px 10px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:5}
table.st{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.st th,table.st td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.st th:first-child,table.st td:first-child{text-align:left;white-space:normal}
table.st th{background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px}
table.st td .k{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px}
.tblwrap{overflow-x:auto;border-radius:14px}
.samplenote{font-size:12px;background:#FFF1D2;color:#7A4E00;border-radius:10px;padding:8px 12px;margin-bottom:10px}
@media (max-width:820px){.skpi{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
.fs.deal{background:#FFF1D2}.fs.deal span{color:#8A5A00}
.deal{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.deal .dt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deal .dt b{font-size:14px;color:var(--ink)}
.steps{display:flex;gap:3px;margin:8px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--green)}
.steps.end i.on{background:#B9B2A8}
.steps.left i.on{background:#D9443A}
.slabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.deal .money{font-size:12.5px;color:var(--text);margin-top:4px}
.deal .money b{color:var(--ink)}
.st-end{background:var(--soft);color:var(--muted)}.st-won{background:#FFF1D2;color:#8A5A00}.st-left{background:#FBE7E5;color:#B3361F}
.dform{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--soft)}
.dform label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.dform input,.dform select{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.bcol{background:var(--soft);border-radius:12px;padding:8px;min-height:120px}
.bcol h3{font-size:12px;margin:0 0 6px;color:var(--ink);display:flex;justify-content:space-between}
.bcol h3 span{color:var(--muted);font-weight:500}
.bcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.bcard b{display:block;font-size:13px;color:var(--ink)}
.bcard span{color:var(--muted)}
.retain{display:flex;flex-direction:column;gap:6px}
.rt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
.rt b{color:var(--ink)}
.rt .left{font-weight:700;color:#B3361F;white-space:nowrap}
@media (max-width:820px){.rt{grid-template-columns:1fr}}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:24px 0 10px}
.foot a,.foot button{color:var(--green);background:none;border:0;cursor:pointer;text-decoration:underline;font-size:12px}
.back{display:none}
.err{color:#B3361F;padding:20px}
.spin{width:32px;height:32px;border-radius:50%;border:4px solid var(--green-soft);border-top-color:var(--green);margin:60px auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
button:focus-visible{outline:3px solid #F3B44B;outline-offset:2px}
@media (max-width:820px){
  .bar{padding:10px 14px}.bar b{font-size:14px;white-space:nowrap}.bar .mode{white-space:nowrap}.bar .upd{display:none}.bar button{white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .main{grid-template-columns:1fr}
  .detail{position:fixed;inset:0;top:0;z-index:20;border-radius:0;max-height:none;transform:translateX(100%);transition:transform .25s;padding-top:0}
  .detail.open{transform:none}
  .back{display:flex;position:sticky;top:0;background:var(--card);margin:0 -18px 10px;padding:12px 18px;border-bottom:1px solid var(--line);gap:6px;align-items:center;font-weight:700;color:var(--green);border:0;width:calc(100% + 36px);cursor:pointer;z-index:2}
}

/* LINEのトーク（CA画面から返信して、やり取りを1か所に残す） */
.chat{border:1px solid var(--line);border-radius:12px;background:#EEF3F1;margin-top:14px;overflow:hidden}
.chat .ch{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.chat .ch b{color:var(--ink);font-size:13.5px}
.chat .ch .sp{flex:1}
.msgs{max-height:340px;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.dsep{align-self:center;font-size:11px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:999px;padding:0 10px;margin:4px 0}
.m{max-width:82%;padding:7px 11px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.m time{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.m.seeker{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:4px;color:var(--ink)}
.m.seeker.new{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot)}
.m.ca{align-self:flex-end;background:#BFEBB5;border-top-right-radius:4px;color:#17331B}
.m.ca time{text-align:right;color:#4C6B4F}
.m.auto{align-self:flex-start;background:transparent;border:1px dashed #C9D3CF;color:var(--muted);font-size:12px}
.m.sys{align-self:center;max-width:95%;background:transparent;color:var(--muted);font-size:11.5px;padding:0;text-align:center}
.m.sys time{display:inline;margin-left:6px}
.compose{border-top:1px solid var(--line);background:var(--card);padding:8px 10px 10px}
.compose textarea{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:62px;resize:vertical;line-height:1.6;margin-top:6px;color:var(--text)}
.compose .frow{margin-top:6px}
.compose .fnote{margin:0;flex:1}
.chips.small .chip{padding:2px 10px;font-size:12px}
.p-unread{background:var(--hot);color:#fff;font-weight:700}
.p-block{background:#4A4F4D;color:#fff}
.p-id{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
/* 紐付け */
.crm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:12.5px;background:var(--green-soft);border-radius:10px;padding:8px 12px;color:var(--ink)}
.crm.off{background:var(--soft);color:var(--muted)}
.crm .sp{flex:1}
.crm input{font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;width:11em;background:#fff}
.crm button,.lnk{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lkres{margin-top:12px;border:1.5px solid var(--green);border-radius:12px;padding:12px;background:#fff}
.url{display:flex;gap:6px;margin:6px 0}
.url input{flex:1;min-width:0;font:inherit;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--soft)}
.lkres textarea{width:100%;font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:120px;line-height:1.7;background:var(--soft)}
.qrw{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.qr{width:112px;height:112px;flex:0 0 112px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.howto div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.howto b{display:block;color:var(--ink);font-size:13px}
.howto i{font-style:normal;font-weight:700;color:var(--green);font-size:16px;margin-right:4px}
.lk-ok{color:var(--green);font-weight:700}.lk-wait{color:#9A6B00;font-weight:700}.lk-ng{color:var(--muted)}
.lktbl td:first-child small{display:block;font-size:11.5px;color:var(--muted)}
.lktbl .lnkt{border:0;background:none;padding:0;color:var(--green);font-size:11.5px;text-decoration:underline;cursor:pointer}
.cfg{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:6px}
.cfg dt{color:var(--muted)}.cfg dd{margin:0;color:var(--ink)}
@media (max-width:760px){.howto{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 担当 */
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.who select{font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card);color:var(--ink);font-weight:700}
.p-ca{background:#EEE9FB;color:#4B3A8F}
.castat{margin-bottom:12px}
.castat summary{font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer}
.castat table{margin-top:8px}
.bar .me{font-size:11px;color:#CFE3DA}
</style>
</head>
<body>
<header class="bar"><b>ONDO Agent｜CA画面</b><span class="mode" id="mode" hidden></span><span class="sp"></span><span class="upd" id="upd"></span><button id="reload">更新</button></header>
<nav class="views" id="views" hidden aria-label="画面の切り替え"></nav>
<div class="wrap" id="app"><div class="spin"></div><p class="empty">読み込んでいます…</p></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script>
(function () {
  const cfg = window.ONDO_CONFIG || {};
  const app = document.getElementById('app');
  const qs = new URLSearchParams(location.search);
  const MOCK = /mock(=|%3D)1/.test(location.search);
  const state = { uid: null, data: null, sel: null, filter: 'alert', act: '', busy: false, form: {} };
  const KEY = 'ondo_ca_key';
  const store = { get: () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }, set: v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) { /* 保存できない環境 */ } } };
  let ownerKey = '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rel = iso => {
    if (!iso) return '—';
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'たった今'; if (m < 60) return `${m}分前`;
    const h = Math.round(m / 60); if (h < 24) return `${h}時間前`;
    return `${Math.round(h / 24)}日前`;
  };
  const abs = iso => { const t = new Date(new Date(iso).getTime() + 9 * 3600e3); return `${t.getUTCMonth() + 1}/${t.getUTCDate()} ${t.getUTCHours()}:${String(t.getUTCMinutes()).padStart(2, '0')}`; };
  // 合言葉：URL の ?key= で受け取ったら保存してアドレスバーから消す（履歴に残さない）
  (function () {
    const k = (qs.get('key') || '').slice(0, 100);
    if (k) { store.set(k); qs.delete('key'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
    ownerKey = store.get();
  })();
  const keyFromHash = () => ownerKey;

  async function api(action, extra) {
    if (MOCK) return mockApi(action, extra || {});
    if (!cfg.gasUrl) throw new Error('サーバーの設定がありません');
    const key = keyFromHash();
    const body = Object.assign({ ondoCa: 1, action }, key ? { key } : { userId: state.uid }, extra || {});
    const j = await window.ondoApi(cfg.gasUrl, body);
    if (!j.ok) { if (j.badKey) { store.set(''); ownerKey = ''; } throw new Error(j.error || '読み込みに失敗しました'); }
    return j;
  }
  const load = () => api('list');
  /* 見た目確認用（?mock=1）：送信・記録は画面の上だけで反映 */
  let mockData = null;
  async function mockApi(action, x) {
    if (!mockData) mockData = await fetch('./mock.json', { cache: 'no-cache' }).then(r => r.json());
    if (/^deal/.test(action)) {
      const now = new Date().toISOString(), ds = mockData.deals;
      if (action === 'dealSave') { const j = (mockData.jobs || []).find(q => q.id === x.jobId) || {}; const fee = Math.round((+x.salary || 0) * 10000 * (+x.feeRate || 30) / 100); ds.push({ id: 'md' + Date.now(), candidateId: x.candidateId, candidateName: (mockData.people.find(p => p.id === x.candidateId) || {}).name || '', jobId: x.jobId, company: j.company || x.company, title: j.title || '', stage: '推薦', history: [{ stage: '推薦', at: now }], salary: +x.salary || 0, feeRate: +x.feeRate || 30, fee, joinDate: '', leftDate: '', refund: 0, net: fee, refundLimit: '', inRefundPeriod: false }); mockData.done = '推薦を記録しました（見た目確認用）'; }
      if (action === 'dealStage') { const dd = ds.find(q => q.id === x.id); if (!dd || dd.sample) throw new Error('サンプルの案件は変更できません'); dd.stage = x.stage; dd.history.push({ stage: x.stage, at: now }); if (x.joinDate) { dd.joinDate = x.joinDate; dd.inRefundPeriod = true; dd.refundLimit = new Date(new Date(x.joinDate).getTime() + 90 * 864e5).toISOString().slice(0, 10); } if (x.leftDate) { dd.leftDate = x.leftDate; dd.refund = Math.round(dd.fee * 0.5); dd.inRefundPeriod = false; } mockData.done = `「${x.stage}」を記録しました（見た目確認用）`; }
      if (action === 'dealDelete') { mockData.deals = ds.filter(q => q.id !== x.id); mockData.done = '削除しました'; }
      return JSON.parse(JSON.stringify(mockData));
    }
    if (/^(bc|sc)/.test(action)) {
      const bc = mockData.bc;
      if (action === 'bcCreate') { const n = mockData.people.filter(p => matchFilter(p, x.filter)).length; bc.broadcasts.unshift({ id: 'm' + Date.now(), name: x.name || '無題の配信', createdAt: new Date().toISOString(), timing: x.timing, sendAt: x.sendAt, status: x.timing === 'now' ? '送信済み' : '予約', targets: n, real: 0, sent: 0, waiting: 0, demo: n, attach: bc.attachments[x.message.attach], reaction: null }); mockData.done = `${n}人が対象（見た目確認用のため送信しません）`; }
      if (action === 'scSave') { const s = bc.scenarios.find(q => q.id === x.id); ['active', 'text', 'name', 'days', 'attach', 'hour', 'filter', 'trigger'].forEach(k => { if (x[k] != null) s[k] = x[k]; }); s.when = (bc.triggers[s.trigger] || '').replace('{days}', s.days); s.attachLabel = bc.attachments[s.attach]; mockData.done = '保存しました（見た目確認用）'; }
      if (action === 'scTest') mockData.done = '試し送信しました（見た目確認用のため送信しません）';
      if (action === 'scAdd') { bc.scenarios.push({ id: 'm' + Date.now(), name: x.name || '無題のステップ配信', trigger: x.trigger, when: (bc.triggers[x.trigger] || '').replace('{days}', x.days), days: x.days, text: x.text, attach: x.attach, attachLabel: bc.attachments[x.attach], active: x.active, hour: x.hour, filter: x.filter, preset: '', reaction: null }); mockData.done = '追加しました（見た目確認用）'; }
      if (action === 'scDelete') { bc.scenarios = bc.scenarios.filter(q => q.id !== x.id); mockData.done = '削除しました'; }
      if (action === 'scReset') mockData.done = '初期設定に戻しました（見た目確認用）';
      if (action === 'bcCancel') { bc.broadcasts.find(q => q.id === x.id).status = '取消'; mockData.done = '取り消しました'; }
      return JSON.parse(JSON.stringify(mockData));
    }
    if (/^(link|unlink)/.test(action)) {
      const L = mockData.link, now = new Date().toISOString();
      const mk = r => { const token = Math.random().toString(16).slice(2).padEnd(32, '0').slice(0, 32); L.links.unshift({ token, crmId: r.crmId, name: r.name || '', source: r.source || '', memo: '', createdAt: now, usedAt: '', expiresAt: new Date(Date.now() + 30 * 864e5).toISOString(), userId: '', status: '未使用', url: `https://liff.line.me/${cfg.liffId}/link/?t=${token}` }); L.counts.issued++; L.counts.waiting++; return token; };
      const out = () => JSON.parse(JSON.stringify(mockData));
      if (action === 'linkCreate') { const o = out(); o.token = mk(x); o.done = '専用リンクを発行しました（見た目確認用）'; return Object.assign(out(), { token: o.token, done: o.done }); }
      if (action === 'linkBulk') { const tokens = x.rows.slice(0, 5).map(mk); return Object.assign(out(), { tokens, done: `${tokens.length}件のリンクを発行しました（見た目確認用）` }); }
      if (action === 'linkCancel') { const l = L.links.find(q => q.token === x.token); l.status = '取消'; L.counts.waiting--; return Object.assign(out(), { done: 'リンクを取り消しました' }); }
      const p = mockData.people.find(q => q.id === x.targetId);
      if (!p.realLine) throw new Error('サンプルの求職者は変更できません');
      if (action === 'linkManual') { Object.assign(p, { crmId: x.crmId, source: '', linkedAt: now }); L.counts.friendsLinked++; return Object.assign(out(), { done: `ID「${x.crmId}」と紐付けました` }); }
      Object.assign(p, { crmId: '', source: '', linkedAt: '' }); L.counts.friendsLinked--; return Object.assign(out(), { done: '紐付けを解除しました' });
    }
    if (action === 'adCostSave') { const L = mockData.link; const r = L.adCosts.find(c => c.month === x.month && c.source === x.source); if (r) r.cost = +x.cost; else L.adCosts.push({ month: x.month, source: x.source, cost: +x.cost, memo: '' }); mockData.done = '保存しました（見た目確認用）'; return JSON.parse(JSON.stringify(mockData)); }
    if (action === 'assign') { const p = mockData.people.find(q => q.id === x.targetId); const c = (mockData.cas || []).find(q => q.caId === x.caId); p.caId = x.caId; p.caName = c ? c.name : ''; mockData.done = '担当を変更しました（見た目確認用）'; return JSON.parse(JSON.stringify(mockData)); }
    if (action === 'log' || action === 'send') {
      const p = mockData.people.find(q => q.id === x.targetId);
      p.chat = p.chat || [];
      p.chat.push(action === 'send' ? { t: new Date().toISOString(), who: 'ca', text: x.text } : { t: new Date().toISOString(), who: 'sys', text: `CA：${x.type}${x.result ? '（' + x.result + '）' : ''}${x.memo ? '｜' + x.memo : ''}` });
      p.unread = 0; if (p.talk && /返信を待って/.test(p.talk[0] || '')) p.talk.shift();
      const type = action === 'send' ? 'LINE送信' : x.type;
      const memo = x.memo || x.text || '';
      p.timeline.unshift({ t: new Date().toISOString(), label: `CA：${type}${x.result ? '（' + x.result + '）' : action === 'send' ? '（返信待ち）' : ''}${memo ? '｜' + memo.slice(0, 40) : ''}`, icon: 'ca', ca: true });
      p.lastCa = { t: new Date().toISOString(), type, result: x.result || (action === 'send' ? '返信待ち' : '') };
      if (x.nextDate) p.nextDate = x.nextDate;
      mockData.done = '対応履歴に記録しました（見た目確認用）';
    }
    return JSON.parse(JSON.stringify(mockData));
  }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
  }

  function render() {
    const nav = document.getElementById('views');
    nav.hidden = false;
    const v = state.view || 'people';
    nav.innerHTML = [['people', '求職者'], ['link', '紐付け'], ['bc', '配信'], ['sc', 'ステップ配信'], ['stats', '配信の分析'], ['sales', '成約・売上']].map(([k, l]) => `<button data-v="${k}" ${v === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.onclick = () => { state.view = b.dataset.v; render(); window.scrollTo(0, 0); });
    if (v === 'bc') return renderBc();
    if (v === 'sc') return renderSc();
    if (v === 'stats') return renderStats();
    if (v === 'sales') return renderSales();
    if (v === 'link') return renderLink();
    renderPeople();
  }

  function renderPeople() {
    const d = state.data;
    const ppl = d.people;
    const alerts = ppl.filter(p => p.alert);
    document.getElementById('mode').hidden = false;
    document.getElementById('mode').textContent = d.mode === 'owner' ? (d.me && d.me.role === 'manager' ? 'マネージャー' : 'CA') : 'デモ';
    document.getElementById('upd').innerHTML = d.mode === 'owner' && d.me ? `<span class="me">${esc(d.me.name)}</span>　` : '';
    document.getElementById('upd').innerHTML += `${abs(d.generatedAt)} 時点`;
    const f = d.funnel;
    // 担当の絞り込み：CA は自分の担当（＋未割り当て）、マネージャーは全員が初期値
    const me = d.me || {}; const cas = d.cas || [];
    if (state.who == null) state.who = me.role === 'ca' ? 'mine' : 'all';
    const whoOk = p => state.who === 'all' || (state.who === 'mine' ? (p.caId === me.caId || !p.caId) : state.who === 'none' ? !p.caId : p.caId === state.who);
    const scoped = ppl.filter(whoOk);
    const alertsS = scoped.filter(p => p.alert);
    const unreadP = scoped.filter(p => p.unread > 0 && !p.blocked);
    const list = state.filter === 'alert' ? alertsS : state.filter === 'unread' ? unreadP : scoped;
    const whoHtml = cas.length ? `<div class="who"><span>担当：</span><select id="whoSel" aria-label="担当で絞り込む">
        ${me.role === 'ca' ? `<option value="mine" ${state.who === 'mine' ? 'selected' : ''}>自分の担当・未割り当て</option>` : ''}
        <option value="all" ${state.who === 'all' ? 'selected' : ''}>全員</option><option value="none" ${state.who === 'none' ? 'selected' : ''}>未割り当て</option>
        ${cas.map(c => `<option value="${esc(c.caId)}" ${state.who === c.caId ? 'selected' : ''}>${esc(c.name)}（${c.assigned}人）</option>`).join('')}</select>
        ${d.mode === 'owner' ? `<span>${d.assignMode === 'manual' ? '新しい友だちは手動で割り当て' : '新しい友だちは担当の少ない CA に自動で割り当て'}</span>` : ''}</div>` : '';
    const castat = cas.length && (me.role !== 'ca' || d.mode === 'demo') ? `<details class="castat" ${state.castatOpen ? 'open' : ''} id="castat"><summary>CA別の状況（担当・対応・成約）</summary>
      <div class="tblwrap"><table class="st"><thead><tr><th>CA</th><th>担当</th><th>今すぐ連絡</th><th>未返信</th><th>面談予約</th><th>今週の対応</th><th>選考中</th><th>成約</th><th>純売上</th></tr></thead><tbody>
      ${cas.map(c => `<tr><td>${esc(c.name)}${c.role === 'manager' ? ' <span class="k">マネージャー</span>' : ''}${!c.calendar ? ' <span class="k">カレンダー未設定</span>' : ''}</td><td>${c.assigned}</td><td>${c.alerts}</td><td>${c.unread}</td><td>${c.booked}</td><td>${c.logs7d}</td><td>${c.inProgress}</td><td>${c.won}</td><td>${yen(c.fee)}</td></tr>`).join('')}
      <tr><td>未割り当て</td><td>${ppl.filter(p => !p.caId).length}</td><td colspan="7"></td></tr></tbody></table></div></details>` : '';
    const self = ppl.find(p => p.self);
    app.innerHTML = `
      ${d.mode === 'demo' ? `<div class="intro"><b>${self ? 'あなたがLINEで操作した内容が、CAにはこう見えます。' : ''}</b>${self ? '（いちばん上の「あなた」）' : ''} ほかの人は架空のサンプルです。温度感は行動ごとの点数を時間とともに減らして計算し、上がった瞬間に「今すぐ連絡」に入ります。</div>` : ''}
      <div class="kpis">
        <div class="kpi hot"><span>今すぐ連絡</span><b>${alerts.length}<small>人</small></b></div>
        <div class="kpi"><span>検討中以上（温度25〜）</span><b>${ppl.filter(p => p.score >= 25).length}<small>人</small></b></div>
        <div class="kpi"><span>面談予約</span><b>${ppl.filter(p => p.stage === '面談').length}<small>人</small></b></div>
        <div class="kpi"><span>友だち（${esc(d.template)}）</span><b>${ppl.length}<small>人</small></b></div>
      </div>
      ${castat}
      <section class="funnel" aria-label="LINE登録から成約までの人数"><h2>LINE登録 → 成約</h2><div class="fsteps">
        ${fullFunnel(d).map((s, i, f2) => { const base = s.label === '推薦' ? f2[0] : f2[i - 1]; const r = i && base && base.n ? Math.round(s.n / base.n * 100) + '%' : ''; return `<div class="fs ${s.deal ? 'deal' : ''}"><span>${esc(s.label)}</span><b>${s.n}</b>${i ? `<i>${s.label === '推薦' ? '友だちの' : ''}${r}</i>` : ''}</div>`; }).join('')}
        <button class="fs next" id="toSales" style="text-align:left;border:0;cursor:pointer"><span>売上（今月）</span><b style="font-size:16px;color:var(--ink)">${yen(salesSum(d, monthRange(0)).net)}</b></button>
      </div></section>
      <div class="main">
        <section aria-label="求職者の一覧">

  }

  function rowHtml(p) {

  /* ---------- 配信 ---------- */
  const BANDS = [['hot', '今すぐ連絡'], ['warm', '検討中'], ['mild', '関心あり'], ['cool', '様子見']];
  const STAGES = ['登録のみ', '興味', '検討', '行動', '面談'];
  function matchFilter(p, f) {
    const has = (arr, v) => !arr || !arr.length || arr.indexOf(v) >= 0;
    if (!has(f.stages, p.stage) || !has(f.bands, p.bandKey)) return false;
    if (f.tags && f.tags.length && !p.tags.some(t => f.tags.indexOf(t) >= 0)) return false;
    for (const label in (f.answers || {})) { const w = f.answers[label]; if (!w || !w.length) continue; const a = p.answers.find(x => x.label === label); if (!a || w.indexOf(a.value) < 0) return false; }
    if (f.inactiveDays && Date.now() - (p.lastAt ? new Date(p.lastAt).getTime() : 0) < f.inactiveDays * 864e5) return false;
    if (f.booking === 'yes' && !p.booking) return false; if (f.booking === 'no' && p.booking) return false;
    if (f.resume === 'done' && p.resume !== '完成') return false; if (f.resume === 'notdone' && p.resume === '完成') return false;
    return true;
  }
  function bcState() {
    if (!state.bc) state.bc = { name: '', filter: { bands: [], stages: [], tags: [], answers: {}, inactiveDays: 0, booking: '', resume: '' }, text: '{名前}さん、こんにちは。\n', attach: 'jobs', timing: 'best', sendAt: '', busy: false };
    return state.bc;
  }
  function renderBc() {
    const d = state.data, bc = d.bc || { broadcasts: [], attachments: {} }, f = bcState();
    const ppl = d.people;
    const targets = ppl.filter(p => matchFilter(p, f.filter));
    const real = targets.filter(p => p.realLine && (d.mode === 'owner' || p.self));
    const tags = [...new Set(ppl.flatMap(p => p.tags))];
    const ansLabels = (ppl[0] ? ppl[0].answers.map(a => a.label) : []).filter(l => l !== '資格');
    const ansVals = l => [...new Set(ppl.map(p => (p.answers.find(a => a.label === l) || {}).value).filter(v => v && v !== '未回答'))];
    const chips = (key, items, sel) => `<div class="chips">${items.map(([v, l]) => `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${sel.indexOf(v) >= 0}">${esc(l)}</button>`).join('')}</div>`;
    const one = (key, items, cur) => `<div class="chips">${items.map(([v, l]) => `<button class="chip" data-one="${key}" data-v="${esc(v)}" aria-pressed="${String(cur) === String(v)}">${esc(l)}</button>`).join('')}</div>`;
    const first = targets.find(p => p.realLine) || targets[0];
    const nm = first ? (first.self ? first.name : first.name.replace('（サンプル）', '')) : '〇〇';
    const q = bc.quota && typeof bc.quota.used === 'number' ? bc.quota : null;
    app.innerHTML = `
      ${d.mode === 'demo' ? '<div class="intro"><b>配信のデモです。</b> 実際に届くのはあなたのLINEだけで、サンプルの求職者には送らず人数だけ数えます。</div>' : ''}
      <div class="bcgrid">
        <section class="panel" aria-label="配信をつくる">
          <h2>配信をつくる</h2><p class="sub">温度感・ステージ・悩み・希望条件で、届ける人を絞り込めます。</p>
          <div class="grp"><b>配信名（管理用）</b><input type="text" id="bName" maxlength="40" placeholder="例：検討中の人に新着求人" value="${esc(f.name)}"></div>
          <div class="grp"><b>温度感</b>${chips('bands', BANDS, f.filter.bands)}</div>
          <div class="grp"><b>ステージ</b>${chips('stages', STAGES.map(x => [x, x]), f.filter.stages)}</div>
          ${tags.length ? `<div class="grp"><b>悩み（読んだコラム・大事にしたいこと）</b>${chips('tags', tags.map(x => [x, x]), f.filter.tags)}</div>` : ''}
          <details ${Object.values(f.filter.answers).some(a => a && a.length) ? 'open' : ''}><summary>希望条件で絞り込む</summary>
            ${ansLabels.map(l => `<div class="grp"><b>${esc(l)}</b>${chips('ans:' + l, ansVals(l).map(x => [x, x]), f.filter.answers[l] || [])}</div>`).join('')}</details>
          <details ${f.filter.inactiveDays || f.filter.booking || f.filter.resume ? 'open' : ''}><summary>行動で絞り込む</summary>
            <div class="grp"><b>最後の行動</b>${one('inactiveDays', [[0, '指定なし'], [7, '7日以上前'], [14, '14日以上前'], [21, '21日以上前']], f.filter.inactiveDays)}</div>
            <div class="grp"><b>面談予約</b>${one('booking', [['', '指定なし'], ['yes', 'あり'], ['no', 'なし']], f.filter.booking)}</div>
            <div class="grp"><b>応募書類</b>${one('resume', [['', '指定なし'], ['done', '完成'], ['notdone', '未完成']], f.filter.resume)}</div></details>
          <div class="count" aria-live="polite"><b>${targets.length}</b><span>人が対象${d.mode === 'demo' ? `（実際に届くのは ${real.length}人）` : `（LINE に届くのは ${real.length}人）`}</span></div>
          <div class="names">${targets.slice(0, 14).map(p => `<span>${esc(p.self ? 'あなた' : p.name.replace('（サンプル）', ''))}</span>`).join('')}${targets.length > 14 ? `<span>ほか${targets.length - 14}人</span>` : ''}</div>
          <div class="grp"><b>メッセージ（{名前} は一人ずつの名前に置き換わります）</b><textarea id="bText" maxlength="1000">${esc(f.text)}</textarea>
            <div class="frow" style="margin-top:6px"><button class="mini" id="insName">{名前} を入れる</button></div></div>
          <div class="grp"><b>添付</b>${one('attach', Object.entries(bc.attachments || {}), f.attach)}</div>
          <div class="grp timing"><b>送るタイミング</b>
            <label><input type="radio" name="tm" value="best" ${f.timing === 'best' ? 'checked' : ''}><span>一人ひとりが LINE をよく開く時間に届ける（おすすめ）<small>行動データから時間を割り出し、各自の時間に順番に送ります。データが少ない人は職種の初期値（保育士は20時）</small></span></label>
            <label><input type="radio" name="tm" value="now" ${f.timing === 'now' ? 'checked' : ''}><span>今すぐ送る</span></label>
            <label><input type="radio" name="tm" value="at" ${f.timing === 'at' ? 'checked' : ''}><span>日時を指定する<input type="datetime-local" id="bAt" value="${esc(f.sendAt)}" style="margin-top:6px"></span></label></div>
          <p class="quota">消費するメッセージ通数：<b>${real.length}通</b>${q ? `　今月の使用：<b>${q.used}</b>${q.limit ? ` / ${q.limit}通` : '通'}` : ''}</p>
          <div class="frow"><button class="go" id="bSend" ${f.busy || !targets.length ? 'disabled' : ''}>${f.busy ? '処理しています…' : f.timing === 'now' ? '送信する' : '配信を予約する'}</button></div>
        </section>

          <div class="panel"><h2>プレビュー（${esc(nm)}さんの場合）</h2>

          <div class="panel" style="margin-top:14px"><h2>配信履歴</h2><p class="sub">反応率＝送ってから48時間以内に、求人を見る・相談するなどの操作をした人の割合（LINE では個別の既読が取れないため）</p>
            <div class="hist">${(bc.broadcasts || []).length ? bc.broadcasts.map(h => `<div class="hi"><div class="t"><b>${esc(h.name)}</b><span class="st ${h.status === '送信済み' ? 'st-done' : h.status === '取消' ? 'st-cancel' : 'st-wait'}">${esc(h.status)}</span></div>
              <div class="n">${abs(h.createdAt)} 作成｜${h.timing === 'best' ? '各自の時間帯' : h.timing === 'at' ? abs(h.sendAt) + ' に配信' : '即時'}｜添付：${esc(h.attach)}</div>
              <div class="n">対象 ${h.targets}人（届く ${h.real}人・サンプル ${h.demo}人）｜送信済み ${h.sent}人${h.waiting ? `・待機 ${h.waiting}人` : ''}｜反応率 <span class="rr">${h.reaction ? h.reaction.rate + '%' : '—'}</span></div>
              ${['予約', '送信中'].indexOf(h.status) >= 0 && h.waiting ? `<div class="frow" style="margin-top:6px"><button class="mini" data-cancel="${esc(h.id)}">残りを取り消す</button></div>` : ''}</div>`).join('') : '<p class="empty" style="padding:14px">まだ配信はありません</p>'}</div></div>
        </section>
      </div>`;
    const keep = () => { f.name = document.getElementById('bName').value; f.text = document.getElementById('bText').value; f.sendAt = document.getElementById('bAt').value; };

    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = b.dataset.v;
      if (k.indexOf('ans:') === 0) { const l = k.slice(4); const a = f.filter.answers[l] = f.filter.answers[l] || []; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); }

      const msg = `${targets.length}人が対象です（LINEに届くのは${real.length}人）。${f.timing === 'now' ? '今すぐ送信' : '配信を予約'}しますか？`;
      if (!confirm(msg)) return;
      f.busy = true; rr();

      f.busy = false; if (ok) { state.bc = null; } render();
    };
  }
  async function doAct(action, x) {

    catch (e) { toast(e.message); return false; }
  }

  /* デモ用：サンプルの実績（実データが少ないときの見本）。期間に合わせて毎回同じ値になるよう日付から作る */
  function sampleStats(from, to) {
    const daily = [];
    const names = [['配信', '検討中の人に新着求人'], ['配信', '持ち帰りに悩む人へコラム'], ['ステップ', '希望条件の登録をうながす'], ['ステップ', '悩みに合うコラムを届ける'], ['ステップ', 'しばらく見ていない人に新着求人'], ['個別', 'CA の個別送信']];
    const acc = names.map(([kind, name]) => ({ key: name, kind, name, sent: 0, reacted: 0, replied: 0, viewed: 0, answered: 0, converted: 0 }));
    for (let t = new Date(from + 'T00:00:00Z'); t.toISOString().slice(0, 10) <= to && daily.length < 400; t = new Date(t.getTime() + 864e5)) {
      const k = t.toISOString().slice(0, 10); const seed = [...k].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 9973, 7);

      acc.forEach((a, i) => {
        const base = a.kind === '配信' ? ((seed + i * 7) % 9 === 0 ? 40 + seed % 25 : 0) : a.kind === 'ステップ' ? 3 + (seed + i) % 6 : 2 + (seed + i) % 4;

        a.sent += n; a.reacted += n * rr; a.replied += n * rr * (a.kind === '個別' ? 0.7 : 0.25); a.viewed += n * rr * 0.8; a.answered += a.name.indexOf('希望条件') >= 0 ? n * 0.32 : n * 0.03; a.converted += n * rr * 0.12;
        row.sent += n; row.reacted += r; row.replied += rep2; row.viewed += v; row.answered += an; row.converted += cv;

      ${f ? `<div class="dform"><label for="dJob">応募先の求人</label><select id="dJob"><option value="">（求人にない会社を入力）</option>${jobs.map(j => `<option value="${esc(j.id)}" ${f.jobId === j.id ? 'selected' : ''}>${esc(j.company)}｜${esc(j.title)}</option>`).join('')}</select>
        <div id="dFree" ${f.jobId ? 'hidden' : ''}><label for="dCo">会社・施設名</label><input type="text" id="dCo" maxlength="60" value="${esc(f.company || '')}"></div>
        <div class="two"><div><label for="dSal">想定年収（万円）</label><input type="number" id="dSal" min="0" max="3000" value="${esc(f.salary || '')}"></div><div><label for="dRate">紹介手数料率（%）</label><input type="number" id="dRate" min="0" max="100" value="${esc(f.feeRate != null ? f.feeRate : state.data.feeRate)}"></div></div>
        <p class="fnote" id="dFee"></p>
        <div class="frow"><button class="go" id="dSave">推薦を記録</button><button class="mini" id="dCancel">やめる</button></div></div>`
      : `<div class="frow" style="margin-top:8px"><button class="mini" id="dAdd">＋ 推薦（選考）を追加</button></div>`}</div>`;
  }
  function bindDeals(p) {
    const q = id => document.getElementById(id);
    const rerender = () => { const el = q('detail'); const y = el.scrollTop; renderDetail(); q('detail').scrollTop = y; };
    const add = q('dAdd'); if (add) add.onclick = () => { state.dealForm = { cid: p.id, jobId: '', feeRate: state.data.feeRate }; rerender(); };
    if (q('dSave')) {
      const calc = () => { const sal = Number(q('dSal').value) || 0, rate = Number(q('dRate').value) || 0; q('dFee').textContent = sal ? `紹介手数料（想定）：${yen(sal * 10000 * rate / 100)}` : '想定年収を入れると、紹介手数料を自動で計算します'; };
      q('dJob').onchange = () => { q('dFree').hidden = !!q('dJob').value; };
      q('dSal').oninput = calc; q('dRate').oninput = calc; calc();
      q('dCancel').onclick = () => { state.dealForm = null; rerender(); };
      q('dSave').onclick = async () => { const ok = await doDeal('dealSave', { candidateId: p.id, jobId: q('dJob').value, company: q('dCo') ? q('dCo').value : '', salary: q('dSal').value, feeRate: q('dRate').value }); if (ok) state.dealForm = null; };
    }
    document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => { if (b.dataset.stage === '入職') { state.dealEdit = { id: b.dataset.next, mode: 'join' }; rerender(); return; } doDeal('dealStage', { id: b.dataset.next, stage: b.dataset.stage }); });
    document.querySelectorAll('[data-end]').forEach(b => b.onclick = () => { if (confirm(`「${b.dataset.stage}」で選考を終了しますか？`)) doDeal('dealStage', { id: b.dataset.end, stage: b.dataset.stage }); });
    document.querySelectorAll('[data-left]').forEach(b => b.onclick = () => { state.dealEdit = { id: b.dataset.left, mode: 'left' }; rerender(); });
    document.querySelectorAll('[data-dcancel]').forEach(b => b.onclick = () => { state.dealEdit = null; rerender(); });
    document.querySelectorAll('[data-dok]').forEach(b => b.onclick = async () => {
      const mode = state.dealEdit.mode, v = q(mode === 'join' ? 'dJoin' : 'dLeft').value;
      if (!v) return toast(mode === 'join' ? '入職日を入れてください' : '退職日を入れてください');
      if (await doDeal('dealStage', mode === 'join' ? { id: b.dataset.dok, stage: '入職', joinDate: v } : { id: b.dataset.dok, stage: '早期退職', leftDate: v })) state.dealEdit = null;
    });
    document.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => { if (confirm('この選考の記録を削除しますか？')) doDeal('dealDelete', { id: b.dataset.ddel }); });
  }
  async function doDeal(action, x) {
    try { const j = await api(action, x); state.data = j; state.dealEdit = null; render(); if (state.view === 'people') document.getElementById('detail').classList.add('open'); toast(j.done || '保存しました'); return true; }
    catch (e) { toast(e.message); return false; }
  }

  /* ---------- 成約・売上 ---------- */
  function monthRange(back) { const t = new Date(Date.now() + 9 * 3600e3); const y = t.getUTCFullYear(), m = t.getUTCMonth() - back; return [new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10), new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0, 10)]; }
  function salesSum(d, [from, to]) {
    const deals = d.deals || [];
    const won = deals.filter(x => x.joinDate && x.joinDate >= from && x.joinDate <= to && (x.stage === '入職' || x.stage === '早期退職'));
    const refunds = deals.filter(x => x.leftDate && x.leftDate >= from && x.leftDate <= to && x.refund);
    const gross = won.reduce((s2, x) => s2 + x.fee, 0), refund = refunds.reduce((s2, x) => s2 + x.refund, 0);
    return { won, refunds, count: won.length, gross, refund, net: gross - refund, avg: won.length ? gross / won.length : 0 };
  }
  function fullFunnel(d) {
    const f = d.funnel || [], ids = new Set(d.people.map(p => p.id));
    const deals = (d.deals || []).filter(x => ids.has(x.candidateId));
    const reached = (stage) => new Set(deals.filter(x => (x.history || []).some(h => h.stage === stage) || x.stage === stage).map(x => x.candidateId)).size;
    return f.concat([{ label: '推薦', n: new Set(deals.map(x => x.candidateId)).size, deal: true }, { label: '内定', n: reached('内定'), deal: true }, { label: '成約（入職）', n: reached('入職'), deal: true }]);
  }
  /* 流入経路別：期間内に追加された友だち・成約・純売上と、月×経路の広告費から CPA・成約単価・費用対効果 */
  function sourceTable(d, [from, to]) {
    const L = d.link || {}, costs = L.adCosts || [];
    const mFrom = from.slice(0, 7), mTo = to.slice(0, 7);
    const rows = {};
    const row = s => rows[s] = rows[s] || { source: s, friends: 0, booked: 0, won: 0, net: 0, cost: 0 };
    d.people.forEach(p => { const s = p.source || '（経路なし）'; const c = (p.createdAt || '').slice(0, 10); if (c && c >= from && c <= to) { row(s).friends++; if (p.stage === '面談') row(s).booked++; } });
    (d.deals || []).forEach(x => { if (x.joinDate && x.joinDate >= from && x.joinDate <= to && (x.stage === '入職' || x.stage === '早期退職')) { const r = row(x.source || '（経路なし）'); r.won++; r.net += x.net; } });
    costs.forEach(c => { if (c.month >= mFrom && c.month <= mTo) row(c.source).cost += c.cost; });
    const list = Object.values(rows).sort((a, b) => (b.net - a.net) || (b.friends - a.friends));
    const tot = list.reduce((a, r) => ({ friends: a.friends + r.friends, booked: a.booked + r.booked, won: a.won + r.won, net: a.net + r.net, cost: a.cost + r.cost }), { friends: 0, booked: 0, won: 0, net: 0, cost: 0 });
    const per = (c, n) => c && n ? yen(c / n) : '—';
    const roi = r => r.cost ? (r.net / r.cost).toFixed(1) + '倍' : '—';
    const tr = r => `<tr><td>${esc(r.source)}</td><td>${r.friends}</td><td>${r.booked}</td><td>${r.won}</td><td>${yen(r.net)}</td><td>${r.cost ? yen(r.cost) : '—'}</td><td>${per(r.cost, r.friends)}</td><td>${per(r.cost, r.won)}</td><td>${roi(r)}</td></tr>`;
    const now = new Date(Date.now() + 9 * 3600e3), ym = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
    const canEdit = d.mode === 'owner' ? (d.me || {}).role === 'manager' : true;
    return `<div class="panel" style="margin-bottom:12px"><h2>流入経路別の費用対効果（この期間）</h2><p class="sub">友だちは追加日、成約は入職日で数えます。広告費は月ごとに入力した額を、期間に含まれる月で合計します。</p>
      <div class="tblwrap"><table class="st"><thead><tr><th>流入経路</th><th>友だち</th><th>面談予約</th><th>成約</th><th>純売上</th><th>広告費</th><th>友だち1人あたり（CPA）</th><th>成約1件あたり</th><th>費用対効果</th></tr></thead><tbody>
        ${list.map(tr).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--muted)">この期間のデータはありません</td></tr>'}
        ${list.length > 1 ? `<tr style="font-weight:700"><td>合計</td><td>${tot.friends}</td><td>${tot.booked}</td><td>${tot.won}</td><td>${yen(tot.net)}</td><td>${tot.cost ? yen(tot.cost) : '—'}</td><td>${per(tot.cost, tot.friends)}</td><td>${per(tot.cost, tot.won)}</td><td>${roi(tot)}</td></tr>` : ''}
      </tbody></table></div>
      ${canEdit ? `<details ${state.adOpen ? 'open' : ''} id="adD"><summary>広告費を入力（月×流入経路）</summary>
        <div class="frow" style="flex-wrap:wrap"><input type="month" id="adM" value="${esc(state.adM || ym)}" aria-label="月" style="font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px"><select id="adS" style="width:auto">${(L.sources || []).map(x => `<option ${state.adS === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select><input type="number" id="adC" min="0" step="1000" placeholder="金額（円）" aria-label="金額" style="width:9em;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px"><button class="go" id="adGo">保存</button></div>
        ${costs.length ? `<p class="fnote">入力済み：${costs.filter(c => c.month >= mFrom && c.month <= mTo).sort((a, b) => a.month < b.month ? -1 : 1).map(c => `${c.month} ${esc(c.source)} ${yen(c.cost)}`).join('　/　') || 'この期間はなし'}</p>` : ''}
        <p class="fnote">${d.mode === 'demo' ? '見本の広告費が入っています。あなたが入力すると、あなた専用の数字に置き換わります。' : '媒体の請求額や広告の月額をそのまま入れてください。'}</p></details>` : ''}</div>`;
  }
  function renderSales() {
    const d = state.data, st = STAGES_D();
    if (!state.sl) state.sl = { key: 'm0', range: monthRange(0) };
    const S = salesSum(d, state.sl.range);
    const deals = d.deals || [];
    const yomi = deals.filter(x => x.stage === '内定承諾').reduce((s2, x) => s2 + x.fee, 0);
    const months = Array.from({ length: 6 }, (_, i) => monthRange(5 - i));
    const mvals = months.map(r => ({ label: +r[0].slice(5, 7) + '月', v: salesSum(d, r) }));
    const max = Math.max(1, ...mvals.map(m => Math.max(m.v.gross, 1)));
    const W = 960, H = 220, padL = 52, padB = 24, padT = 22, bw = (W - padL) / 6, top = max * 1.15, y = v => padT + (H - padT - padB) * (1 - v / top);
    let g = '';
    for (let i = 0; i <= 3; i++) { const v = top / 3 * i; g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v / 10000)}万</text>`; }
    mvals.forEach((m, i) => {
      const x = padL + i * bw + bw * 0.22, w = bw * 0.56, h = y(0) - y(m.v.net);
      if (m.v.net > 0) g += `<path d="M${x},${y(0)} v${-Math.max(0, h - 4)} q0,-4 4,-4 h${w - 8} q4,0 4,4 v${Math.max(0, h - 4)} z" fill="var(--green)"/>`;
      g += `<text x="${x + w / 2}" y="${y(m.v.net) - 6}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-weight="700">${m.v.net ? Math.round(m.v.net / 10000) + '万' : ''}</text><text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${m.label}</text>`;
      g += `<rect class="mh" data-i="${i}" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/>`;
    });
    const active = st.slice(0, -1);
    const pd = id => d.people.find(p => p.id === id);
    const retain = deals.filter(x => x.inRefundPeriod).sort((a, b) => a.refundLimit < b.refundLimit ? -1 : 1);
    const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    const daysLeft = dt => Math.max(0, Math.round((new Date(dt) - new Date(today)) / 864e5));
    const curRate = x => { const days = Math.round((new Date(today) - new Date(x.joinDate)) / 864e5); const r = (d.refundRules || []).find(q => days <= q.days); return r ? r.rate : 0; };
    const presets = [['m0', '今月', monthRange(0)], ['m1', '先月', monthRange(1)], ['q', '過去3ヶ月', [monthRange(2)[0], monthRange(0)[1]]], ['h', '過去6ヶ月', [monthRange(5)[0], monthRange(0)[1]]]];
    app.innerHTML = `
      ${d.mode === 'demo' ? '<div class="intro"><b>LINE 登録から成約・売上まで</b>を、1人の求職者でつなげて管理できます。サンプルの案件は見本です。あなたやサンプルの求職者に選考を記録すると、ここに反映されます（デモの記録はあなたにしか見えません）。</div>' : ''}
      <div class="period" role="group" aria-label="集計期間">${presets.map(([k, l]) => `<button class="chip" data-sp="${k}" aria-pressed="${state.sl.key === k}">${l}</button>`).join('')}
        <span style="margin-left:6px;font-size:12px;color:var(--muted)">期間</span><input type="date" id="sFrom" value="${state.sl.range[0]}" aria-label="開始日"><span>〜</span><input type="date" id="sTo" value="${state.sl.range[1]}" aria-label="終了日"><button class="mini" id="sGo">集計</button></div>
      <div class="skpi">
        <div class="kpi"><span>成約（入職）</span><b>${S.count}<small style="display:inline">件</small></b><small>入職日で計上</small></div>
        <div class="kpi"><span>売上（紹介手数料）</span><b>${yen(S.gross)}</b><small>入職月ベース</small></div>
        <div class="kpi"><span>返金</span><b style="color:${S.refund ? '#B3361F' : 'var(--ink)'}">${yen(S.refund)}</b><small>早期退職の月で差し引き</small></div>
        <div class="kpi"><span>純売上</span><b>${yen(S.net)}</b><small>売上 − 返金</small></div>
        <div class="kpi"><span>平均単価</span><b>${yen(S.avg)}</b><small>1件あたり</small></div>
        <div class="kpi"><span>ヨミ（内定承諾）</span><b>${yen(yomi)}</b><small>入職待ちの想定売上</small></div>
      </div>
      <div class="chartbox"><h2>月別の純売上（直近6か月）</h2><div class="chartscroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の純売上">${g}</svg></div><div class="tip" id="tip2" hidden></div></div>
      <div class="panel" style="margin-bottom:12px"><h2>選考中の案件</h2><p class="sub">カードを押すと、その求職者の詳細を開きます。</p>
        <div class="board">${active.map(sg => { const cs = deals.filter(x => x.stage === sg); return `<div class="bcol"><h3>${esc(sg)}<span>${cs.length}件</span></h3>${cs.map(x => `<button class="bcard" data-open="${esc(x.candidateId)}"><b>${esc((pd(x.candidateId) || {}).self ? 'あなた' : x.candidateName.replace('（サンプル）', ''))}</b><span>${esc(x.company)}</span><br><span>${x.fee ? yen(x.fee) : '手数料未入力'}</span></button>`).join('')}</div>`; }).join('')}</div></div>
      <div class="panel" style="margin-bottom:12px"><h2>定着フォロー（返金の対象期間中）</h2><p class="sub">入職から${d.refundDays || 90}日以内に辞めると返金になる人です。入職直後の声かけで早期退職を防ぎます。</p>
        <div class="retain">${retain.length ? retain.map(x => `<div class="rt"><span><b>${esc(x.candidateName.replace('（サンプル）', ''))}</b>｜${esc(x.company)}｜入職 ${esc(x.joinDate)}</span><span>いま辞めた場合の返金 <b>${yen(x.fee * curRate(x))}</b></span><span class="left">あと${daysLeft(x.refundLimit)}日</span></div>`).join('') : '<p class="fnote">返金の対象期間中の人はいません</p>'}</div></div>
      ${sourceTable(d, state.sl.range)}
      <div class="tblwrap"><table class="st"><thead><tr><th>成約・返金（この期間）</th><th>応募先</th><th>入職日</th><th>紹介手数料</th><th>返金</th></tr></thead><tbody>
        ${S.won.concat(S.refunds.filter(x => S.won.indexOf(x) < 0)).map(x => `<tr><td>${esc(x.candidateName)}</td><td style="text-align:left">${esc(x.company)}</td><td>${esc(x.joinDate)}</td><td>${S.won.indexOf(x) >= 0 ? yen(x.fee) : '—'}</td><td>${x.refund && x.leftDate >= state.sl.range[0] && x.leftDate <= state.sl.range[1] ? yen(x.refund) : '—'}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">この期間の成約・返金はありません</td></tr>'}
      </tbody></table></div>
      <p class="fnote" style="margin-top:8px">紹介手数料率の初期値は${d.feeRate}%（スクリプト プロパティ FEE_RATE で変更）。返金規定の初期値：${(d.refundRules || []).map(r => `入職から${r.days}日以内の退職は${Math.round(r.rate * 100)}%`).join('、')}。契約に合わせて変更できます。</p>`;
    app.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { const pr = presets.find(x => x[0] === b.dataset.sp); state.sl = { key: pr[0], range: pr[2] }; renderSales(); });
    const adD = document.getElementById('adD');
    if (adD) { adD.ontoggle = () => { state.adOpen = adD.open; }; document.getElementById('adGo').onclick = async () => { const month = document.getElementById('adM').value, source = document.getElementById('adS').value, cost = document.getElementById('adC').value; state.adM = month; state.adS = source; if (!month || cost === '') return toast('月と金額を入れてください'); try { const j = await api('adCostSave', { month, source, cost }); state.data = j; renderSales(); toast(j.done || '保存しました'); } catch (e) { toast(e.message); } }; }
    document.getElementById('sGo').onclick = () => { const a = document.getElementById('sFrom').value, b2 = document.getElementById('sTo').value; if (!a || !b2) return toast('期間を指定してください'); state.sl = { key: '', range: a <= b2 ? [a, b2] : [b2, a] }; renderSales(); };
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { const id = b.dataset.open; if (!d.people.find(p => p.id === id)) return toast('過去の案件のため、求職者の詳細はありません'); state.view = 'people'; state.filter = 'all'; state.sel = id; render(); document.getElementById('detail').classList.add('open'); scrollTo(0, 0); });
    const tip = document.getElementById('tip2'), box = tip.parentElement;
    app.querySelectorAll('.mh').forEach(h => { const show = () => { const m = mvals[+h.dataset.i]; const r = h.getBoundingClientRect(), b = box.getBoundingClientRect(); tip.hidden = false; tip.innerHTML = `${m.label}　成約 ${m.v.count}件<br>売上 ${yen(m.v.gross)}・返金 ${yen(m.v.refund)}`; tip.style.left = (r.left - b.left + r.width / 2) + 'px'; tip.style.top = (r.top - b.top + 20) + 'px'; }; h.addEventListener('mouseenter', show); h.addEventListener('click', show); h.addEventListener('mouseleave', () => { tip.hidden = true; }); });
  }

  /* ---------- LINEのトーク・対応の記録 ---------- */
  const templates = p => {
    const n = p.self ? 'あなた' : p.name.replace('（サンプル）', '') + 'さん';
    const brand = state.data.brand || '';
    return {
      'ご挨拶': `${n}、こんにちは。${brand}の担当キャリアアドバイザーです。\nLINEでのご登録ありがとうございます。気になる求人や、今の職場のことなど、なんでも気軽にご相談ください。`,
      '求人の提案': `${n}、こんにちは。ご希望の条件に近い求人が見つかったのでご案内します。\n${p.tags[0] ? `「${p.tags[0]}」を大事にされていると伺い、` : ''}職場の雰囲気も含めて詳しくお伝えできます。ご都合のよいときにお返事ください。`,
      '面談の日程': `${n}、こんにちは。一度お電話かオンラインで、ご希望を詳しく伺えたらうれしいです。\nメニューの「相談する」から、空いている日時を選んで予約できます。`,
      '書類の添削': `${n}、書類の作成おつかれさまでした。内容を拝見しました。\n自己PRをもう少し具体的にすると、さらに伝わりやすくなります。詳しくご説明しますね。`
    };
  };
  const sendNote = p => p.realLine ? (state.data.mode === 'owner' ? '公式アカウントから届きます（メッセージ通数にカウント）' : `あなたのLINEに届きます（デモは1日${state.data.sendLimit}通まで）`) : 'サンプルなので送信はせず、記録だけ残ります';
  function msgsHtml(p) {
    const items = p.chat || [];
    if (!items.length) return '<p class="empty" style="padding:16px">まだやり取りはありません</p>';
    const lastCa = p.lastCa ? new Date(p.lastCa.t).getTime() : 0;
    let day = '';
    return items.map(c => {

    };
    document.getElementById('lGo').onclick = () => { keep(); if (!lk.crmId.trim()) return toast('求職者IDを入れてください'); run('linkCreate', { crmId: lk.crmId, name: lk.name, source: lk.source }); };
    document.getElementById('lBulkGo').onclick = () => { keep(); const rows = lk.bulk.split(/\r?\n/).map(l => l.split(/[,\t]/).map(x => x.trim())).filter(r => r[0]).map(r => ({ crmId: r[0], name: r[1] || '', source: r[2] || '' })); if (!rows.length) return toast('1行に「ID,氏名,流入経路」の形で入れてください'); run('linkBulk', { rows }); };
    const bd = document.getElementById('lBulkDl');
    if (bd) bd.onclick = () => downloadCsv('ondo_links.csv', [['求職者ID', '氏名', '流入経路', 'リンク', '文面', '期限']].concat(lk.tokens.map(t => L.links.find(x => x.token === t)).filter(Boolean).map(l => [l.crmId, l.name, l.source, l.url, linkMessage(l, d.brand), l.expiresAt ? abs(l.expiresAt).split(' ')[0] : ''])));
    if (res) {
      document.getElementById('cpUrl').onclick = () => copyText(res.url, 'リンクをコピーしました');
      document.getElementById('cpMsg').onclick = () => copyText(document.getElementById('lMsg').value, '文面をコピーしました');
      loadQr(() => { const q = document.getElementById('qr'); if (q && window.QRCode && !q.firstChild) new QRCode(q, { text: res.url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); });
    }
    app.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { lk.token = b.dataset.show; renderLink(); scrollTo(0, 0); });
    app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { if (b.dataset.ask !== '1') { b.dataset.ask = '1'; b.textContent = 'もう一度で取消'; return; } run('linkCancel', { token: b.dataset.cancel }); });
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { state.view = 'people'; state.filter = 'all'; state.sel = b.dataset.open; render(); document.getElementById('detail').classList.add('open'); scrollChat(); scrollTo(0, 0); });
    document.getElementById('exp').onclick = () => downloadCsv('ondo_friends.csv', [['求職者ID', 'LINEユーザーID', 'LINEの表示名', '流入経路', '紐付け日', '温度感', 'ステージ', '悩み', '最後の行動', '未返信', '面談予約', 'ブロック']].concat(d.people.filter(p => !p.sample || d.mode === 'demo').map(p => [p.crmId, p.realLine ? p.id : '', p.self ? 'あなた' : p.name, p.source, p.linkedAt ? abs(p.linkedAt) : '', p.score, p.stage, (p.tags || []).join('・'), p.lastAt ? abs(p.lastAt) : '', p.unread || 0, p.booking ? p.booking.label : '', p.blocked ? 'はい' : ''])));
  }

  function showLogin(msg) {
    app.innerHTML = `<form class="login" id="lf"><h1>CA・マネージャーとしてログイン</h1><p class="fnote" style="margin:0">CA ごとの合言葉（cas シートの key 列）か、マネージャーの合言葉（スクリプト プロパティ CA_VIEW_KEY）を入力してください。この端末に保存され、次回から入力は不要です。</p>
      <input type="password" id="lk" autocomplete="current-password" aria-label="合言葉" placeholder="合言葉">
      ${typeof msg === 'string' ? `<p class="err" style="padding:0 0 8px">${esc(msg)}</p>` : ''}
      <div class="frow"><button class="go" type="submit">ログイン</button><button type="button" class="chip" id="lc">キャンセル</button></div></form>`;
    document.getElementById('lf').onsubmit = ev => { ev.preventDefault(); const v = document.getElementById('lk').value.trim(); if (!v) return; store.set(v); ownerKey = v; app.innerHTML = '<div class="spin"></div>'; start(); };
    document.getElementById('lc').onclick = () => { app.innerHTML = '<div class="spin"></div>'; start(); };
    document.getElementById('lk').focus();
  }

  async function start() {
    try {
      // PC のブラウザ（PC 版 LINE から開いた場合も含む）では、LINE ログインの画面を経由して本人を確認する
      if (!MOCK && !keyFromHash() && cfg.liffId && window.liff) {
        await liff.init({ liffId: cfg.liffId, withLoginOnExternalBrowser: true });
        if (liff.isLoggedIn()) state.uid = (await liff.getProfile()).userId;
      }
    } catch (e) { console.warn('LIFF init failed', e); }
    if (!MOCK && !keyFromHash() && !state.uid) { app.innerHTML = '<p class="err">LINEでログインできませんでした。</p><p class="foot"><button id="ownerLogin">CA・マネージャーとしてログイン</button></p>'; document.getElementById('ownerLogin').onclick = showLogin; return; }
    try {
      state.data = await load();
      const self = state.data.people.find(p => p.self);
      state.sel = state.sel || (self || state.data.people[0] || {}).id;
      if (self && !self.alert) state.filter = 'all';
      render();
    } catch (e) {
      if (!keyFromHash() && /合言葉/.test(e.message)) return showLogin(e.message);
      app.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    }
  }
  document.getElementById('reload').onclick = () => { app.innerHTML = '<div class="spin"></div>'; start(); };
  start();
})();
</script>
</body>
</html>
